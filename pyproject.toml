[project]
name = "omnikv"
version = "0.1.0"
description = "Layout-agnostic KV cache system for vLLM (research phase; see research.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]
# CPU-only torch for local (macOS) unit tests of geometry/region math.
# GPU deps (vllm, cuda torch) are installed only in the remote environment.
local-cpu = [
    "torch>=2.5; sys_platform == 'darwin'",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
