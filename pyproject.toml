[project]
name = "omnikv"
version = "0.1.0"
description = "Layout-agnostic KV cache system for vLLM (M5: validation and optimization)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnikv"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]
# CPU-only torch for local (macOS x86_64) unit tests of geometry/region
# math. GPU deps (vllm, cuda torch) live only in the remote environment.
# Upper bound: torch >= 2.15 dropped macOS x86_64 wheels.
local-cpu = [
    "torch>=2.5,<2.15; sys_platform == 'darwin'",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
